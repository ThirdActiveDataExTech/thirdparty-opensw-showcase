# 로컬 실행용 최소 구성 — PostgreSQL + pgvector, S3 호환 스토리지(MinIO).
#
#   docker compose up -d
#
# 운영 환경과 버전을 맞춰 두었다. pgvector 0.8.x는 HNSW 부분 인덱스를 지원한다.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: metadata
      POSTGRES_USER: metadata
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      # HNSW 인덱스 빌드용. 기본 64MB에서는 약 17,700행부터 그래프가 메모리를
      # 넘겨 빌드가 크게 느려진다(docs/adr/016 참조).
      POSTGRES_INITDB_ARGS: "-c maintenance_work_mem=2GB"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metadata -d metadata"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 호환 스토리지 — SeaweedFS 단일 노드(master + volume + filer + S3 게이트웨이).
  # minio/minio 공식 이미지가 Docker Hub에서 내려가(2026-11 확인, 404) SeaweedFS로 바꿨다.
  # 운영 환경도 SeaweedFS다. .env의 S3_ACCESS_KEY/S3_SECRET_KEY가 관리자 계정이 되고,
  # 버킷(S3_BUCKET)은 처음 저장할 때 자동으로 생긴다.
  seaweedfs:
    image: chrislusf/seaweedfs:4.37
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-change-me}
    ports:
      - "9000:8333"   # .env 기본값 S3_ENDPOINT=http://localhost:9000 을 그대로 쓴다
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  s3data:
